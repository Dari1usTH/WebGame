<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Puzzle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var lang = (localStorage.getItem('lang') || 'en').toLowerCase();
        if (lang !== 'ro' && lang !== 'en') lang = 'en';
        var relativePath = lang === 'ro'
          ? '/WebGame/pagini/puzzle_ro.html'
          : '/WebGame/pagini/puzzle_en.html';

        location.replace(relativePath);
      } catch (e) {
        location.replace('/WebGame/pagini/puzzle_en.html');
      }
    })();
  </script>
</head>
</html>
